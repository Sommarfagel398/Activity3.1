<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<header>
    <h1>API Tester</h1>
    <span>jsonplaceholder.typicode.com/users</span>
</header>

<div class="main">
    <aside class="sidebar">
        <div class="sidebar-label">Methods</div>
        <button class="nav-btn active btn-get" onclick="activateMethod('GET')">
            <span class="badge g">GET</span> Users
        </button>
        <button class="nav-btn btn-post" onclick="activateMethod('POST')">
            <span class="badge po">POST</span> Create
        </button>
        <button class="nav-btn btn-put" onclick="activateMethod('PUT')">
            <span class="badge pu">PUT</span> Replace
        </button>
        <button class="nav-btn btn-patch" onclick="activateMethod('PATCH')">
            <span class="badge pa">PATCH</span> Update
        </button>
        <button class="nav-btn btn-delete" onclick="activateMethod('DELETE')">
            <span class="badge d">DEL</span> Remove
        </button>

        <div class="status-footer">
            <div class="sidebar-label" style="margin-bottom:6px;">Status</div>
            <div id="statusCode" class="idle">—</div>
            <div id="statusText">No request sent</div>
        </div>
    </aside>

    <div class="content">
        <div class="form-panel" id="formPanel">
            <form onsubmit="event.preventDefault(); handleSubmit();">
                <div class="field">
                    <label for="id">id:</label>
                    <input type="text" id="id" name="id">
                </div>
                <div class="field">
                    <label for="fname">First name:</label>
                    <input type="text" id="fname" name="fname">
                </div>
                <div class="field">
                    <label for="user">user:</label>
                    <input type="text" id="user" name="user">
                </div>
                <div class="field">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email">
                </div>
                <div class="field full">
                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address">
                </div>
                <div class="field full">
                    <button type="submit" class="submit-btn" id="submitBtn">UPDATE</button>
                </div>
            </form>
        </div>

        <div class="output-panel">
            <div class="output-header">
                <span>Response</span>
                <span id="outputMeta"></span>
            </div>
            <div id="output">
                <div class="placeholder">Select a method to send a request</div>
            </div>
        </div>
    </div>
</div>

<script src="function.js"></script>
</body>
</html>
